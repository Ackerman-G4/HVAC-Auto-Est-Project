name: Frontend gates

# The gate that has been run by hand on every wave of the frontend overhaul,
# made enforceable: types, lint (a11y included), tests, build, and a bundle
# budget so the 2.5MB the overhaul is trying to reduce cannot quietly grow back.

on:
  push:
    branches: [main, main-backup2]
  pull_request:
    branches: [main, main-backup2]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # tsc --noEmit && eslint src && vitest run
      - name: Check (types, lint, tests)
        run: npm run check

      # REMEDIATION_PLAN.md TASK 5.2. Floors set at the measured baseline, so
      # this fails on a reduction rather than demanding an improvement.
      # Graduated: 14% globally, 74% on src/lib/engine, 71% on
      # src/lib/validation, because one number would either let the
      # correctness-critical directories rot or fail the other forty.
      #
      # Runs the suite a second time rather than replacing 'npm run check'
      # above, so that what CI runs and what a developer runs locally stay the
      # same command. The duplicate run costs seconds; gate drift costs trust.
      - name: Coverage thresholds
        run: npm run test:coverage

      # REMEDIATION_PLAN.md TASK 3.3. A ratchet rather than a flat 120: applied
      # flatly today it fails 26 of 47 handlers, and a gate that is red on
      # arrival is one people route around. New handlers must meet 120; the
      # existing 27 are frozen at their current size and may only shrink.
      - name: Handler size ceiling
        run: npm run check:handler-size

      - name: Build
        run: npx next build

      # Binding. REMEDIATION_PLAN.md TASK 5.6.
      #
      # 2700KB against a measured 2641KB: 59KB of headroom, about 2%. Enough to
      # absorb build-to-build variance, far too little to absorb a new library.
      # The previous 2800KB left 159KB of slack, which is roughly a charting
      # dependency's worth of room to regress into unnoticed.
      #
      # The wording was the only advisory thing here — the step already exited 1
      # on breach. A comment describing a blocking gate as advisory is worse
      # than either, because it tells a reviewer the red build is ignorable.
      - name: Bundle budget
        run: |
          RAW=$(find .next/static/chunks -name '*.js' -exec cat {} \; | wc -c)
          GZ=$(find .next/static/chunks -name '*.js' -exec gzip -c {} \; | wc -c)
          LARGEST=$(find .next/static/chunks -name '*.js' -printf '%s\n' | sort -rn | head -1)
          echo "raw:     $(( RAW / 1024 )) KB"
          echo "gzipped: $(( GZ / 1024 )) KB"
          echo "largest: $(( LARGEST / 1024 )) KB"

          BUDGET_GZ=$(( 2700 * 1024 ))
          if [ "$GZ" -gt "$BUDGET_GZ" ]; then
            echo "::error::gzipped JS $(( GZ / 1024 ))KB exceeds the $(( BUDGET_GZ / 1024 ))KB budget"
            exit 1
          fi
